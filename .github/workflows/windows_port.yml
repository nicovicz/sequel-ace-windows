name: Windows Port

on:
  pull_request:
    paths:
      - 'WindowsPort/**'
      - '.github/workflows/windows_port.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Rust port
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # WindowsPort/build-windows.ps1 resolves libmysqlclient on its own (vcpkg,
      # which is preinstalled on the runner), runs the same checks, and writes
      # dist/SequelAce-Windows-x64.exe.
      - name: Build and test
        working-directory: WindowsPort
        run: ./build-windows.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequel-ace-windows-x64
          path: WindowsPort/dist/SequelAce-Windows-x64.exe
          if-no-files-found: error
